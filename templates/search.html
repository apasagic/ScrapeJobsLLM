<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Jobs Finder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f6fb;
            color: #243043;
        }
        header {
            background: #234b84;
            color: white;
            padding: 28px 36px;
        }
        header h1 { font-size: 2rem; margin-bottom: 6px; }
        header p { color: #d9e6f7; }
        .container { max-width: 1220px; margin: 0 auto; padding: 24px; }
        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #d7deea;
            margin-bottom: 20px;
        }
        .tab-button {
            border: 1px solid transparent;
            background: transparent;
            padding: 12px 18px;
            font-weight: 700;
            color: #41516a;
            cursor: pointer;
        }
        .tab-button.active {
            background: white;
            border-color: #d7deea;
            border-bottom-color: white;
            color: #234b84;
        }
        .panel {
            display: none;
            background: white;
            border: 1px solid #d7deea;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(31, 45, 68, 0.08);
        }
        .panel.active { display: block; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 18px;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #2d3a4e;
        }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cfd8e6;
            border-radius: 6px;
            font: inherit;
            background: white;
        }
        textarea {
            min-height: 180px;
            resize: vertical;
            font-family: Consolas, "Courier New", monospace;
        }
        .checkbox-line {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            font-weight: 700;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        button {
            border: 0;
            border-radius: 6px;
            padding: 12px 18px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        .primary { background: #2c5aa0; color: white; }
        .secondary { background: #e9edf4; color: #26364d; }
        .danger { background: #fae8e8; color: #9c2525; }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        .status {
            display: none;
            margin: 18px 0;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid #cfd8e6;
            background: #f8fafc;
        }
        .status.active { display: block; }
        .status.error { border-color: #ff8a8a; background: #fff0f0; color: #9c2525; }
        .status.success { border-color: #8ed6a0; background: #effaf2; color: #205d31; }
        .summary {
            background: #f5f8fc;
            border-left: 4px solid #2c5aa0;
            padding: 16px;
            border-radius: 6px;
            margin: 18px 0;
            line-height: 1.55;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 18px;
        }
        .stat-card {
            border: 1px solid #dce3ef;
            border-radius: 8px;
            padding: 16px;
            background: #fbfcfe;
        }
        .stat-card h3 { font-size: 1rem; margin-bottom: 12px; color: #234b84; }
        .bar-row { margin: 10px 0; }
        .bar-label {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.92rem;
            margin-bottom: 4px;
        }
        .bar-track { height: 9px; background: #e5ebf4; border-radius: 99px; overflow: hidden; }
        .bar-fill { height: 100%; background: #2c5aa0; }
        .job-card {
            border: 1px solid #dce3ef;
            border-left: 4px solid #2c5aa0;
            border-radius: 8px;
            padding: 16px;
            margin: 14px 0;
            background: #fbfcfe;
        }
        .job-card h3 { color: #1f3f70; margin-bottom: 6px; }
        .meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            color: #5b6a80;
            font-size: 0.92rem;
            margin: 8px 0;
        }
        .job-card p { line-height: 1.5; margin-top: 10px; }
        .job-card a { color: #2c5aa0; font-weight: 700; text-decoration: none; }
        @media (max-width: 760px) {
            .form-grid { grid-template-columns: 1fr; }
            .tabs { flex-wrap: wrap; }
            .container { padding: 14px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>ML Jobs Finder</h1>
        <p>Ingest jobs, search saved roles, and inspect market signals for your learning plan.</p>
    </header>

    <main class="container">
        <nav class="tabs">
            <button class="tab-button active" data-tab="ingest">Ingest Jobs</button>
            <button class="tab-button" data-tab="search">Search Database</button>
            <button class="tab-button" data-tab="analytics">Analytics</button>
        </nav>

        <section class="panel active" id="tab-ingest">
            <form id="ingestForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="ingestQuery">Job/API search query</label>
                        <input id="ingestQuery" type="text" placeholder="machine learning junior remote" required>
                    </div>
                    <div class="form-group">
                        <label for="ingestJobs">Preview after ingest</label>
                        <select id="ingestJobs">
                            <option value="5">5 jobs</option>
                            <option value="10" selected>10 jobs</option>
                            <option value="15">15 jobs</option>
                            <option value="20">20 jobs</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="ingestCv">CV / profile for LLM fitness scoring</label>
                    <textarea id="ingestCv" placeholder="Paste your CV or profile here..." required></textarea>
                </div>
                <label class="checkbox-line">
                    <input id="clearBeforeIngest" type="checkbox">
                    Clear existing database before ingesting
                </label>
                <div class="actions">
                    <button class="primary" type="submit" id="ingestBtn">Fetch from JSearch + RemoteOK</button>
                    <button class="secondary" type="button" id="clearDbBtn">Clear Database</button>
                </div>
            </form>
            <div class="status" id="ingestStatus"></div>
            <div id="ingestResults"></div>
        </section>

        <section class="panel" id="tab-search">
            <form id="dbSearchForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="dbQuery">Search saved jobs</label>
                        <input id="dbQuery" type="text" placeholder="jobs related to time series" required>
                    </div>
                    <div class="form-group">
                        <label for="dbJobs">Jobs to show</label>
                        <select id="dbJobs">
                            <option value="5">5 jobs</option>
                            <option value="10" selected>10 jobs</option>
                            <option value="15">15 jobs</option>
                            <option value="20">20 jobs</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="searchCv">Optional CV/profile context for summary</label>
                    <textarea id="searchCv" placeholder="Paste CV/profile if you want the summary to reference fit..."></textarea>
                </div>
                <div class="actions">
                    <button class="primary" type="submit" id="searchBtn">Search Stored Jobs</button>
                    <button class="secondary" type="button" id="exportBtn">Export Last Results</button>
                </div>
            </form>
            <div class="status" id="searchStatus"></div>
            <div id="searchResults"></div>
        </section>

        <section class="panel" id="tab-analytics">
            <div class="actions">
                <button class="primary" type="button" id="loadStatsBtn">Refresh Analytics</button>
            </div>
            <div class="status" id="analyticsStatus"></div>
            <div id="analyticsResults"></div>
        </section>
    </main>

    <script>
        let lastSearchResults = null;

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function setStatus(id, message, type = '') {
            const box = document.getElementById(id);
            box.textContent = message;
            box.className = `status active ${type}`;
        }

        function clearStatus(id) {
            const box = document.getElementById(id);
            box.className = 'status';
            box.textContent = '';
        }

        async function postJson(url, payload) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Request failed');
            return data;
        }

        function renderJobs(jobs) {
            if (!jobs || jobs.length === 0) return '<p>No matching jobs found.</p>';
            return jobs.map((job, index) => `
                <article class="job-card">
                    <h3>#${index + 1} ${escapeHtml(job.title || 'N/A')}</h3>
                    <div class="meta">
                        <span>${escapeHtml(job.company || 'Company N/A')}</span>
                        <span>${escapeHtml(job.location || 'Remote')}</span>
                        <span>${escapeHtml(job.source || 'Unknown source')}</span>
                        <span>Fit: ${escapeHtml(job.job_fitness || 'N/A')}</span>
                    </div>
                    <p>${escapeHtml(job.description || 'No description available')}</p>
                    <div class="meta">
                        <span>${escapeHtml(job.seniority || 'Seniority N/A')}</span>
                        <span>${escapeHtml(job.experience || 'Experience N/A')}</span>
                        <span>${escapeHtml(job.salary || 'Salary N/A')}</span>
                    </div>
                    <p><strong>Why:</strong> ${escapeHtml(job.comment || 'No fit rationale available')}</p>
                    <p><a href="${escapeHtml(job.url || job.link || '#')}" target="_blank">View job</a></p>
                </article>
            `).join('');
        }

        function renderSearchResult(data) {
            const llmNote = data.llm_enabled ? '' : '<p><strong>Note:</strong> LLM summary/fitness scoring is not enabled unless OpenRouter is configured.</p>';
            return `
                <div class="summary">
                    ${llmNote}
                    <p>${escapeHtml(data.summary || '').replaceAll('\n', '<br>')}</p>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Search Result</h3>
                        <p>Total DB jobs: <strong>${escapeHtml(data.stats?.total_jobs_in_db ?? 'N/A')}</strong></p>
                        <p>Shown: <strong>${escapeHtml(data.stats?.matched_count ?? data.matched_jobs?.length ?? 0)}</strong></p>
                        <p>Candidates: <strong>${escapeHtml(data.stats?.candidate_count ?? 'N/A')}</strong></p>
                    </div>
                </div>
                ${renderJobs(data.matched_jobs || [])}
            `;
        }

        function renderBars(items, labelKey, valueKey = 'count') {
            if (!items || items.length === 0) return '<p>No data yet.</p>';
            const max = Math.max(...items.map(item => Number(item[valueKey]) || 0), 1);
            return items.map(item => {
                const label = item[labelKey] ?? item.value ?? item.category ?? item.bucket ?? item.source ?? 'Unknown';
                const count = Number(item[valueKey]) || 0;
                const width = Math.max(3, Math.round((count / max) * 100));
                return `
                    <div class="bar-row">
                        <div class="bar-label"><span>${escapeHtml(label)}</span><strong>${count}</strong></div>
                        <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
                    </div>
                `;
            }).join('');
        }

        function renderAnalytics(data) {
            return `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Jobs</h3>
                        <p><strong>${escapeHtml(data.total_jobs || 0)}</strong> stored jobs</p>
                    </div>
                    <div class="stat-card">
                        <h3>ML Niches</h3>
                        ${renderBars(data.area_distribution, 'category')}
                    </div>
                    <div class="stat-card">
                        <h3>Top Skills</h3>
                        ${renderBars(data.top_skills, 'value')}
                    </div>
                    <div class="stat-card">
                        <h3>Libraries / Frameworks</h3>
                        ${renderBars(data.top_libraries, 'value')}
                    </div>
                    <div class="stat-card">
                        <h3>Experience</h3>
                        ${renderBars(data.experience_distribution, 'bucket')}
                    </div>
                    <div class="stat-card">
                        <h3>Sources</h3>
                        ${renderBars(data.source_distribution, 'source')}
                    </div>
                </div>
            `;
        }

        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(item => item.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(item => item.classList.remove('active'));
                button.classList.add('active');
                document.getElementById(`tab-${button.dataset.tab}`).classList.add('active');
            });
        });

        document.getElementById('ingestForm').addEventListener('submit', async event => {
            event.preventDefault();
            const button = document.getElementById('ingestBtn');
            button.disabled = true;
            clearStatus('ingestStatus');
            setStatus('ingestStatus', 'Fetching from JSearch and RemoteOK, then updating the database...');
            try {
                const query = document.getElementById('ingestQuery').value.trim();
                const cv = document.getElementById('ingestCv').value.trim();
                const numJobs = Number(document.getElementById('ingestJobs').value || 10);
                const clear = document.getElementById('clearBeforeIngest').checked;
                const ingest = await postJson('/api/ingest', { query, cv, clear });
                const search = await postJson('/api/search-db', { query, cv, num_jobs: numJobs });
                lastSearchResults = search;
                setStatus('ingestStatus', `Scraped ${ingest.scraped_count} jobs, ingested ${ingest.ingested_count}. JSearch: ${ingest.source_counts.JSearch || 0}, RemoteOK: ${ingest.source_counts.RemoteOK || 0}.`, ingest.errors?.length ? 'error' : 'success');
                document.getElementById('ingestResults').innerHTML = renderSearchResult(search);
            } catch (error) {
                setStatus('ingestStatus', error.message, 'error');
            } finally {
                button.disabled = false;
            }
        });

        document.getElementById('dbSearchForm').addEventListener('submit', async event => {
            event.preventDefault();
            const button = document.getElementById('searchBtn');
            button.disabled = true;
            clearStatus('searchStatus');
            setStatus('searchStatus', 'Searching stored jobs...');
            try {
                const query = document.getElementById('dbQuery').value.trim();
                const cv = document.getElementById('searchCv').value.trim();
                const numJobs = Number(document.getElementById('dbJobs').value || 10);
                const data = await postJson('/api/search-db', { query, cv, num_jobs: numJobs });
                lastSearchResults = data;
                setStatus('searchStatus', `Found ${data.matched_jobs.length} jobs.`, 'success');
                document.getElementById('searchResults').innerHTML = renderSearchResult(data);
            } catch (error) {
                setStatus('searchStatus', error.message, 'error');
            } finally {
                button.disabled = false;
            }
        });

        document.getElementById('clearDbBtn').addEventListener('click', async () => {
            if (!confirm('Clear all stored jobs?')) return;
            try {
                await fetch('/api/clear', { method: 'POST' });
                setStatus('ingestStatus', 'Database cleared.', 'success');
            } catch (error) {
                setStatus('ingestStatus', error.message, 'error');
            }
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (!lastSearchResults) {
                setStatus('searchStatus', 'Search first, then export.', 'error');
                return;
            }
            const response = await fetch('/export', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    jobs: lastSearchResults.matched_jobs,
                    summary: lastSearchResults.summary
                })
            });
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `job_search_${new Date().toISOString().slice(0, 10)}.html`;
            document.body.appendChild(link);
            link.click();
            URL.revokeObjectURL(url);
            link.remove();
        });

        document.getElementById('loadStatsBtn').addEventListener('click', async () => {
            clearStatus('analyticsStatus');
            setStatus('analyticsStatus', 'Loading analytics...');
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Could not load analytics');
                setStatus('analyticsStatus', 'Analytics refreshed.', 'success');
                document.getElementById('analyticsResults').innerHTML = renderAnalytics(data);
            } catch (error) {
                setStatus('analyticsStatus', error.message, 'error');
            }
        });
    </script>
</body>
</html>
